name: JapanDaily Auto-Sync & Deploy

on:
  schedule:
    - cron: '0 * * * *'  # 毎時0分 (UTC) に自動実行
  workflow_dispatch:       # GitHub画面・iPhoneアプリから手動実行可能

permissions:
  contents: write   # 新規JSONファイルをgit pushする
  pages:    write   # GitHub Pagesにデプロイする
  id-token: write   # PagesデプロイのOIDCトークン

concurrency:
  group: japan-daily-pipeline
  cancel-in-progress: false  # 実行中のジョブはキャンセルせず待機

jobs:
  sync-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url:  ${{ steps.deploy.outputs.page_url }}

    steps:
      # 1. チェックアウト
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token:       ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # 2. Node.js セットアップ
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 3. 商品同期（PA-API → Gemini → JSON保存）
      - name: Sync products
        env:
          AMAZON_ACCESS_KEY:    ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY:    ${{ secrets.AMAZON_SECRET_KEY }}
          AMAZON_PARTNER_TAG:   ${{ secrets.AMAZON_PARTNER_TAG }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          X_API_KEY:            ${{ secrets.X_API_KEY }}
          X_API_SECRET:         ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:       ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:      ${{ secrets.X_ACCESS_SECRET }}
          META_ACCESS_TOKEN:    ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID:         ${{ secrets.META_PAGE_ID }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: node scripts/sync.js

      # 4. 新規JSONファイルをコミット&プッシュ
      # [skip ci] で次のワークフロートリガーを防止
      - name: Commit new product files
        run: |
          git config --global user.name  'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/content/products/
          if git diff --staged --quiet; then
            echo "No new content — skipping commit"
          else
            COUNT=$(git diff --staged --name-only | wc -l | tr -d ' ')
            git commit -m "chore(sync): add ${COUNT} product(s) $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          fi

      # 5. Astroビルド
      # SITE_URL / BASE_PATH はリポジトリ情報から自動計算（手動設定不要）
      - name: Build Astro
        env:
          SITE_URL:  https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      # 6. GitHub Pagesへデプロイ
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
